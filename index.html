<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Te amo, Fátima</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    color: white;
}

/* Contenedor principal */
.container {
    position: relative;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* Texto central */
.center-text {
    position: absolute;
    font-size: 4em;
    font-weight: bold;
    color: #ff2f92;
    text-shadow:
        0 0 10px #ff2f92,
        0 0 25px #ff2f92,
        0 0 50px #ff2f92;
    z-index: 3;
    animation: glow 2s infinite alternate;
}

/* Texto inferior */
.bottom-text {
    margin-top: 30px;
    font-size: 1.8em;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 10px #fff;
    z-index: 3;
}

/* SVG corazón */
svg {
    width: 420px;
    height: 380px;
    z-index: 2;
}

/* Trazo neón */
.heart-path {
    fill: none;
    stroke: #ff2f92;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 12px #ff2f92)
            drop-shadow(0 0 25px #ff2f92);
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    animation:
        draw 4s ease forwards,
        pulse 1.4s infinite ease-in-out;
}

/* Corazones cayendo */
.falling-heart {
    position: fixed;
    top: -10vh;
    font-size: 22px;
    animation: fall linear infinite;
    pointer-events: none;
}

/* Animaciones */
@keyframes draw {
    to { stroke-dashoffset: 0; }
}

@keyframes pulse {
    0% { stroke-width: 7; }
    50% { stroke-width: 10; }
    100% { stroke-width: 7; }
}

@keyframes glow {
    from {
        text-shadow:
            0 0 10px #ff2f92,
            0 0 25px #ff2f92;
    }
    to {
        text-shadow:
            0 0 25px #ff2f92,
            0 0 60px #ff2f92;
    }
}

@keyframes fall {
    from {
        transform: translateY(-10vh);
        opacity: 1;
    }
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- TEXTO CENTRAL -->
    <div class="center-text">TE AMO</div>

    <!-- CORAZÓN NEÓN DIBUJADO -->
    <svg viewBox="0 0 512 512">
        <!-- Lado izquierdo -->
        <path class="heart-path"
        d="M256 460
           C120 340, 60 260, 60 180
           C60 110, 120 60, 190 60
           C230 60, 256 90, 256 90" />

        <!-- Lado derecho -->
        <path class="heart-path"
        d="M256 460
           C392 340, 452 260, 452 180
           C452 110, 392 60, 322 60
           C282 60, 256 90, 256 90" />
    </svg>

    <!-- TEXTO INFERIOR -->
    <div class="bottom-text">
        Te amo, Fátima<br>
        eres mi persona favorita
    </div>
</div>

<script>
// Corazones cayendo
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "falling-heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
}, 300);
</script>

</body>
</html>
